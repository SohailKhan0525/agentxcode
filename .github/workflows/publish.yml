name: publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AGENTX_VERSION: ${{ github.ref_name != 'dev' && startsWith(github.ref_name, 'v') && github.ref_name || inputs.version || '3.0.0' }}

jobs:
  build:
    name: build binaries & vsix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup git committer
        run: |
          git config --global user.email "bot@agentx.js.org"
          git config --global user.name "AgentX Bot"

      - name: Build Web UI
        run: bun --cwd packages/app build

      - name: Build Multi-Target Binaries
        run: |
          bun run --cwd packages/opencode build
        env:
          AGENTX_VERSION: ${{ env.AGENTX_VERSION }}
          OPENCODE_VERSION: ${{ env.AGENTX_VERSION }}
          GH_REPO: ${{ github.repository }}

      - name: Package Archives & Checksums
        run: |
          cd packages/opencode/dist
          for d in agentx-*/; do
            target="${d%/}"
            if [[ "$target" == *"windows"* ]]; then
              zip -r "${target}.zip" "${target}/bin"
            else
              tar -czf "${target}.tar.gz" -C "${target}/bin" .
            fi
          done
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          ls -la

      - name: Build VS Code Extension (.vsix)
        run: |
          cd sdks/vscode
          bun install --ignore-scripts
          bun run package || true
          npx --yes @vscode/vsce package -o ../../packages/opencode/dist/agentx-vscode.vsix --no-dependencies || true
        continue-on-error: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            packages/opencode/dist/*.zip
            packages/opencode/dist/*.tar.gz
            packages/opencode/dist/SHA256SUMS.txt
            packages/opencode/dist/*.vsix

  release:
    name: github release & publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt dist/*.vsix \
            --title "AgentX Code $tag" \
            --notes "AgentX Code Release $tag — Autonomous AI coding agent built for the terminal." \
            --repo ${{ github.repository }} || gh release upload "$tag" dist/* --clobber --repo ${{ github.repository }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            bun ./packages/opencode/script/publish.ts || true
          fi
        continue-on-error: true

      - name: Publish to JSR
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: |
          if [ -n "$JSR_TOKEN" ]; then
            npx --yes jsr publish --token "$JSR_TOKEN" --allow-dirty || true
          fi
        continue-on-error: true

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          echo "@SohailKhan0525:registry=https://npm.pkg.github.com" >> ~/.npmrc
        continue-on-error: true
