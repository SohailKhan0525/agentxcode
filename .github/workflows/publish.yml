name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AGENTX_VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || inputs.version || '3.0.0' }}

jobs:
  validate-secrets:
    name: validate release secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          echo "=== Validating Required Secrets for AgentX Code Release ==="
          missing_critical=0

          if [ -z "${{ secrets.NPM_TOKEN }}" ] && [ -z "${{ secrets.NODE_AUTH_TOKEN }}" ]; then
            echo "::error::Missing secret: NPM_TOKEN is required to publish @agent-qofeno/agentx-cli to the npm registry."
            missing_critical=1
          else
            echo "✓ NPM_TOKEN is configured"
          fi

          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ] && [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::warning::Missing secret: HOMEBREW_TAP_TOKEN (or GH_PAT) is needed to update the SohailKhan0525/homebrew-agentx tap formula."
          else
            echo "✓ HOMEBREW_TAP_TOKEN (or GH_PAT) is configured"
          fi

          if [ -z "${{ secrets.JSR_TOKEN }}" ]; then
            echo "::warning::Missing secret: JSR_TOKEN is needed to publish to JSR registry (jsr.io)."
          else
            echo "✓ JSR_TOKEN is configured"
          fi

          if [ $missing_critical -eq 1 ]; then
            echo "Critical release secrets are missing. Please add them in GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All critical release secrets validated successfully."

  build:
    name: build binaries & vsix
    needs: validate-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup git committer
        run: |
          git config --global user.email "bot@agentx.js.org"
          git config --global user.name "AgentX Bot"

      - name: Build Web UI
        run: bun --cwd packages/app build

      - name: Build Multi-Target Binaries
        run: |
          bun run --cwd packages/opencode build
        env:
          AGENTX_VERSION: ${{ env.AGENTX_VERSION }}
          OPENCODE_VERSION: ${{ env.AGENTX_VERSION }}
          AGENTX_RELEASE: "true"
          GH_REPO: ${{ github.repository }}

      - name: Package Archives & Checksums
        run: |
          cd packages/opencode/dist
          for d in @agent-qofeno/agentx-cli-*/; do
            [ -d "$d" ] || continue
            target="${d%/}"
            target_name="${target#@agent-qofeno/agentx-cli-}"
            archive="agentx-${target_name}"
            if [[ "$archive" == *"windows"* ]]; then
              if [ ! -f "${archive}.zip" ]; then
                zip -r "${archive}.zip" "${target}/bin"
              fi
            else
              if [ ! -f "${archive}.tar.gz" ]; then
                tar -czf "${archive}.tar.gz" -C "${target}/bin" .
              fi
            fi
          done
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          ls -la

      - name: Build VS Code Extension (.vsix)
        run: |
          cd sdks/vscode
          bun install --ignore-scripts
          bun run package
          npx --yes @vscode/vsce package -o ../../packages/opencode/dist/agentx-vscode.vsix --no-dependencies

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: packages/opencode/dist/

  release:
    name: github release & publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: packages/opencode/dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" == "dev" || "$tag" == "main" || "$tag" != v* ]]; then
            tag="v${{ env.AGENTX_VERSION }}"
          fi
          cd packages/opencode/dist
          gh release view "$tag" --repo ${{ github.repository }} || gh release create "$tag" *.zip *.tar.gz SHA256SUMS.txt agentx-vscode.vsix \
            --title "AgentX Code $tag" \
            --notes "AgentX Code Release $tag — Autonomous AI coding agent built for the terminal." \
            --repo ${{ github.repository }}
          gh release upload "$tag" *.zip *.tar.gz SHA256SUMS.txt agentx-vscode.vsix --clobber --repo ${{ github.repository }} || true

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            bun ./packages/opencode/script/publish.ts
          else
            echo "NODE_AUTH_TOKEN is not set; skipping npm publish"
          fi

      - name: Publish to JSR
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: |
          if [ -n "$JSR_TOKEN" ]; then
            npx --yes jsr publish --token "$JSR_TOKEN" --allow-dirty || true
          fi
        continue-on-error: true

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/opencode
          if [ -d "dist/@agent-qofeno/agentx-cli" ]; then
            mkdir -p "dist/@SohailKhan0525/agentx-cli"
            cp -r dist/@agent-qofeno/agentx-cli/* dist/@SohailKhan0525/agentx-cli/
            node -e '
              const fs = require("fs");
              const p = "dist/@SohailKhan0525/agentx-cli/package.json";
              const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
              pkg.name = "@SohailKhan0525/agentx-cli";
              pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            '
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
            echo "@SohailKhan0525:registry=https://npm.pkg.github.com" >> ~/.npmrc
            cd dist/@SohailKhan0525/agentx-cli
            bun pm pack
            npm publish *.tgz --registry=https://npm.pkg.github.com || true
          fi
        continue-on-error: true

      - name: Trigger Homebrew Tap Update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run homebrew.yml --repo ${{ github.repository }} -f tag="v${{ env.AGENTX_VERSION }}" || true
