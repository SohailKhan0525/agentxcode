name: generate

on:
  push:
    branches:
      - dev

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          agentx-app-id: ${{ vars.AGENTX_APP_ID }}
          agentx-app-secret: ${{ secrets.AGENTX_APP_SECRET }}

      - name: Generate
        run: ./script/generate.ts

      - name: Commit and push
        run: |
          # Never let the generate bot modify workflow files — that requires
          # a special GitHub App permission we don't grant the bot.
          git restore .github/workflows/ 2>/dev/null || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore: generate" --allow-empty
          git push origin HEAD:${{ github.ref_name }} --no-verify
