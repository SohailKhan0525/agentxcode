name: cross-platform

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        # --ignore-scripts avoids node-gyp native module failures on CI runners
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build agentx binary (single target, no web UI embed)
        id: build
        run: bun --cwd packages/opencode run build --single --skip-embed-web-ui
        continue-on-error: true
        env:
          AGENTX_VERSION: "3.0.0"
          OPENCODE_VERSION: "3.0.0"

      - name: Report build result
        shell: bash
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::warning::Binary build failed on ${{ matrix.os }} — this may be a platform-specific issue."
          else
            echo "Build succeeded on ${{ matrix.os }}"
          fi

      - name: Verify binary (Linux/macOS)
        if: runner.os != 'Windows' && steps.build.outcome == 'success'
        shell: bash
        run: |
          BIN=$(find packages/opencode/dist -name "agentx" -not -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "::warning::agentx binary not found in dist — build may have skipped output"
            exit 0
          fi
          chmod +x "$BIN"
          OUTPUT=$("$BIN" --version 2>&1 || true)
          echo "Binary output: $OUTPUT"
          echo "Binary verified at: $BIN"

      - name: Verify binary (Windows)
        if: runner.os == 'Windows' && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path packages/opencode/dist -Recurse -Filter "agentx.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bin) {
            Write-Warning "agentx.exe not found in dist"
            exit 0
          }
          $output = & $bin.FullName --version 2>&1
          Write-Host "Binary output: $output"
          Write-Host "Binary verified at: $($bin.FullName)"
